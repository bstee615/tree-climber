name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
    
    - name: Install dependencies
      run: |
        apt install -y graphviz graphviz-dev
        uv sync --dev
    
    - name: Run ruff format check
      run: |
        uv run ruff format --check .
    
    - name: Run ruff lint
      run: |
        uv run ruff check .
    
    - name: Run pyright type checking
      run: |
        uv run pyright

  test:
    name: Testing
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
    
    - name: Install dependencies
      run: |
        apt install -y graphviz graphviz-dev
        uv sync --dev
    
    - name: Run pytest
      run: |
        uv run pytest -v

  deploy-review-app:
    name: Deploy Review App
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to review environment
      run: |
        echo "Deploying review app for PR #${{ github.event.pull_request.number }}"
        echo "This job only runs when both tests and linting pass"
        # Add your deployment commands here
        # See docs/ci-cd-workflows.md for detailed configuration examples
        # Example platforms:
        # - Vercel: npm install -g vercel && vercel deploy --token=$VERCEL_TOKEN --yes
        # - Netlify: npm install -g netlify-cli && netlify deploy --auth=$NETLIFY_AUTH_TOKEN --site=$NETLIFY_SITE_ID --dir=dist
        # - Heroku: curl https://cli-assets.heroku.com/install.sh | sh && git push heroku ${{ github.head_ref }}:main
        # - Railway: npm install -g @railway/cli && railway up
        # - Custom deployment script: ./deploy-review.sh
